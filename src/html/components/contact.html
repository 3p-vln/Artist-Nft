<div class="contact">
  <div class="contact__bg bg">
    <div class="bg__diamonds diamonds">
      <div class="diamonds__purple">
        <img src="@img/components/contact/purple-diamond.png" alt="purple-diamond">
      </div>

      <div class="diamonds__blue-top">
        <img src="@img/components/contact/blue-diamond.png" alt="blue-diamond">
      </div>

      <div class="diamonds__blue-buttom">
        <img src="@img/components/contact/blue-diamond.png" alt="blue-diamond">
      </div>
    </div>

    <div class="bg__cube">
      <img src="@img/components/contact/cube.png" alt="cube">
    </div>
  </div>

  <div class="container">
    <div class="contact__content">
      <div class="contact__title title">
        <h3 class="title__subtitle">
          CONTACT ME
        </h3>

        <h2 class="title__main">
          Want to apply your work or an question appeared?
        </h2>
      </div>

      <form action="" class="contact__form form">
        <div class="form__item">
          <label class="form__label" for="name">
            Name
          </label>

          <input type="text" class="form__input" id="name" placeholder="Your name">
        </div>

        <div class="form__item">
          <label class="form__label" for="mail">
            Mail
          </label>

          <input type="text" class="form__input" id="mail" placeholder="Your mail">
        </div>

        <div class="form__item">
          <label class="form__label" for="question">
            Your question
          </label>

          <textarea class="form__input form__input_big" id="question" placeholder="Your question"></textarea>
        </div>

        <button class="form__btn btn btn_light" type="submit">Send message</button>

        <div class="form__submit checkbox">
          <label>
            <input type="checkbox" class="checkbox__real" id="check">
            <span class="checkbox__custom"></span>
            I agree with
            <a href="#">Privacy Policy</a>
            and
            <a href="#">Terms of use</a>
          </label>
        </div>
      </form>
    </div>
  </div>
</div>
