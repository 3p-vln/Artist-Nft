<div class="chose__payment crypto chose__payment_@@active">
  <form class="chose__form form" id="crypto">
    <div class="form__item">
      <label class="form__label">
        To purchase item by crypto you have to send money to this wallet. After 5 minute result will sent in your mail
      </label>

      <div class="form__input form__input_copy">
        <p class="form__link">
          EQBSSl0Xlo3...kkHTmFw5YVYOiWJ.
        </p>

        <img class="form__cope-link" src="@img/svg/copy.svg" alt="copy">
      </div>
    </div>

    <div class="form__item">
      <label class="form__label" for="mail">
        E-mail
      </label>

      <input class="form__input" id="mail" type="text" placeholder="Your e-mail">
    </div>

    <button class="form__btn btn btn_light" type="submit">Check</button>

    <div class="form__submit checkbox">
      <label>
        <input type="checkbox" class="checkbox__real" id="check">
        <span class="checkbox__custom"></span>
        I agree with
        <a href="#">Privacy Policy</a>
        and
        <a href="#">Terms of use</a>
      </label>
    </div>

  </form>
</div>
