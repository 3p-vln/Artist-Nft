<div class="forum">

  <div class="forum__bg">
    <img src="@img/blog/forum-bg.jpg" alt="forum-bg">
  </div>

  <div class="container">
    <div class="forum__content">
      <div class="forum__info">
        <h2 class="forum__title">
          Forum
        </h2>

        <p class="forum__popular">
          <img src="@img/svg/star-white.svg" alt="star">

          Popular questions
        </p>
      </div>

      <div class="forum__swiper swiper">
        <div class="swiper-wrapper">
          <div class="forum__post post swiper-slide">
            <div class="post__main-info">
              <div class="post__bg">
                <img src="@img/blog/post-bg-1.jpg" alt="post-bg">
              </div>

              <div class="post__avatar-date">
                <div class="post__avatar">
                  <img src="@img/svg/avatar.svg" alt="avatar">
                </div>

                <p class="post__date">
                  12/09/2021
                </p>
              </div>
            </div>

            <div class="post__sub-info">
              <p class="post__author">
                Ivan Ivanov
              </p>

              <p class="post__question">
                How can i Buy any art by crypto?
              </p>

              <div class="post__btns">
                <button class="post__view btn btn_dark">
                  <span>View answers (23)</span>
                </button>

                <button class="post__answer">
                  <img src="@img/svg/answer.svg" alt="answer">

                  Answer
                </button>
              </div>
            </div>
          </div>
