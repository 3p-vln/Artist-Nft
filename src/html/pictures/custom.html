<div class="custom">
  <div class="custom__bg bg">
    <div class="bg__diamonds diamonds">
      <div class="diamonds__purple">
        <img src="@img/components/contact/purple-diamond.png" alt="purple-diamond">
      </div>

      <div class="diamonds__blue-top">
        <img src="@img/components/contact/blue-diamond.png" alt="blue-diamond">
      </div>

      <div class="diamonds__blue-buttom">
        <img src="@img/components/contact/blue-diamond.png" alt="blue-diamond">
      </div>
    </div>

    <div class="bg__cube">
      <img src="@img/components/contact/cube.png" alt="cube">
    </div>
  </div>

  <div class="container">
    <div class="custom__content">
      <div class="custom__title title">
        <h3 class="title__subtitle">
          CUSTOM BY YOUR OWN
        </h3>

        <h2 class="title__main">
          Want to get your own?
        </h2>
      </div>

      <form action="" class="custom__form form">
        <div class="form__item">
          <label for="type" class="form__label">
            Type of item
          </label>

          <div class="dropdown dropdown_form">
            <button type="button" class="dropdown__btn">
              <input type="text" class="dropdown__input_hidden" id="type">

              <span class="dropdown__selected">
                TYPE
              </span>

              <img src="@img/svg/arrow-gradient.svg" alt="arrow">
            </button>

            <ul class="dropdown__list">
              <li class="dropdown__list-item" data-value="t-shirt">T-SHIRT</li>
              <li class="dropdown__list-item" data-value="hoodie">HOODIE</li>
              <li class="dropdown__list-item" data-value="sweatshirt">SWEATSHIRT</li>
              <li class="dropdown__list-item" data-value="jacket">JACKET</li>
              <li class="dropdown__list-item" data-value="shirt">SHIRT</li>
            </ul>
          </div>
        </div>

        <div class="form__item">
          <label class="form__label">
            Color
          </label>

          <div class="form__colors">
            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="red">
              <span class="radio__custom radio__custom_red"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="orange">
              <span class="radio__custom radio__custom_orange"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="yellow">
              <span class="radio__custom radio__custom_yellow"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="green">
              <span class="radio__custom radio__custom_green"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="mint">
              <span class="radio__custom radio__custom_mint"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="light-blue">
              <span class="radio__custom radio__custom_light-blue"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="blue">
              <span class="radio__custom radio__custom_blue"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="purple">
              <span class="radio__custom radio__custom_purple"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="light-purple">
              <span class="radio__custom radio__custom_light-purple"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="pink">
              <span class="radio__custom radio__custom_pink"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="dirty-red">
              <span class="radio__custom radio__custom_dirty-red"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="white">
              <span class="radio__custom radio__custom_white"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="gray">
              <span class="radio__custom radio__custom_gray"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="brown">
              <span class="radio__custom radio__custom_brown"></span>
            </label>

            <label class="form__radio radio">
              <input type="radio" class="radio__real" name="color" value="black">
              <span class="radio__custom radio__custom_black"></span>
            </label>
          </div>
        </div>

        <div class="form__item">
          <label for="size" class="form__label">
            Size
          </label>

          <div class="dropdown dropdown_form">
            <button type="button" class="dropdown__btn">
              <input type="text" class="dropdown__input_hidden" id="size">

              <span class="dropdown__selected">
                SIZE
              </span>

              <img src="@img/svg/arrow-gradient.svg" alt="arrow">
            </button>

            <ul class="dropdown__list">
              <li class="dropdown__list-item" data-value="xs">XS (87-91-97)</li>
              <li class="dropdown__list-item" data-value="s">S (92-96-102)</li>
              <li class="dropdown__list-item" data-value="m">M (97-101-107)</li>
              <li class="dropdown__list-item" data-value="l">L (102-106-112)</li>
              <li class="dropdown__list-item" data-value="xl">XL (107-111-117)</li>
            </ul>
          </div>
        </div>

        <div class="form__item">
          <label class="form__label" for="question">
            Your comment
          </label>

          <textarea class="form__input form__input_big" id="question" placeholder="Comment"></textarea>
        </div>

        <button class="form__btn btn btn_light" type="submit">Send message</button>

        <div class="form__submit checkbox">
          <label>
            <input type="checkbox" class="checkbox__real" id="check">
            <span class="checkbox__custom"></span>
            I agree with
            <a href="#">Privacy Policy</a>
            and
            <a href="#">Terms of use</a>
          </label>
        </div>
      </form>
    </div>
  </div>
</div>
