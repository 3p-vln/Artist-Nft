<div class="chose__payment credit chose__payment_@@active">
  <form class="chose__form form" id="credit">
    <div class="form__item">
      <label class="form__label" for="credit-card">
        Card number
      </label>

      <input class="form__input" id="credit-card" type="text" placeholder="0000 0000 0000 0000">
    </div>

    <div class="form__items">
      <div class="form__item">
        <label class="form__label" for="credit-date">
          Date
        </label>

        <input class="form__input" id="credit-date" type="text" placeholder="01/01">
      </div>

      <div class="form__item">
        <label class="form__label" for="credit-ccv">
          CCV
        </label>

        <input class="form__input" id="credit-ccv" type="number" placeholder="000">
      </div>
    </div>

    <div class="form__item">
      <label class="form__label" for="credit-name">
        Name on card
      </label>

      <input class="form__input" id="credit-name" type="text" placeholder="Ivan Ivanov">
    </div>

    <button class="form__btn btn btn_light" type="submit">Purchase</button>

    <div class="form__submit checkbox">
      <label>
        <input type="checkbox" class="checkbox__real" id="credit-check">
        <span class="checkbox__custom"></span>
        I agree with
        <a href="#">Privacy Policy</a>
        and
        <a href="#">Terms of use</a>
      </label>
    </div>

  </form>
</div>
