<div class="proccess">
  <div class="container">
    <div class="proccess__content">
      <div class="proccess__title">
        <img src="@img/svg/video.svg" alt="video">

        <span>PROCCESS</span>
      </div>

      <div class="proccess__video video">
        <div class="video__img">
          <img src="" alt="preview">
        </div>

        <button class="video__play">
          <img src="@img/svg/play.svg" alt="play">
        </button>

        <div class="video__info info">
          <div class="info__author author">
            <div class="author__img">
              <img src="@img/components/cards/pechen-auth.png" alt="author">
            </div>

            <p class="author__name">
            </p>
          </div>

          <div class="info__premium">
            <img src="@img/svg/crown-gradient.svg" alt="crown">

            <span>premium content</span>
          </div>

          <p class="info__date">
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
