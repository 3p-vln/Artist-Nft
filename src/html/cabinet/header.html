<header class="header">
  <div class="container">
    <div class="header__content">
      <a href="index.html" class="header__logo">
        <img src="@img/svg/logo-main.svg" alt="logo">
      </a>

      <nav class="header__menu">
        <div class="menu">
          <ul class="menu__list">
            <li class="menu__list-item menu__list-item_@@messagesAvailable" id="messages">
              <img src="@img/svg/messages.svg" alt="messages">

              Messages
            </li>

            <li class="menu__list-item menu__list-item_@@ordersAvailable" id="orders">
              <img src="@img/svg/orders.svg" alt="orders">

              Orders
            </li>

            <li class="menu__list-item menu__list-item_@@nftOrdersAvailable" id="nft-orders">
              <img src="@img/svg/nft-orders.svg" alt="nft-orders">

              NFT Orders
            </li>

            <li class="menu__list-item menu__list-item_@@workersAvailable" id="workers">
              <img src="@img/svg/workers.svg" alt="workers">

              Workers
            </li>

            <li class="menu__list-item menu__list-item_@@statisticsAvailable" id="statistics">
              <img src="@img/svg/statistics.svg" alt="statistics">

              Statistics
            </li>
            
            <li class="menu__list-item logout">
              <a href="index.html">
                <img src="@img/svg/log-out-gray.svg" alt="log-out-gray">

                Log out
              </a>

              <p class="menu__info">
                All rights reserved © 2022
              </p>
            </li>
          </ul>

          <ul class="menu__btns">
            <li class="menu__log-out">
              <a href="index.html">
                Log out

                <img src="@img/svg/log-out-light.svg" alt="log-out-light">
              </a>
            </li>
          </ul>

          <div class="menu__back"></div>
        </div>
      </nav>

      <div class="header__burger-menu burger-menu">
        <div class="burger-menu__btn">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>
</header>
