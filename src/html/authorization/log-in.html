<div class="chose__auth login chose__auth_@@active">
  <form class="chose__form form" id="login-form">
    <div class="form__item">
      <label class="form__label" for="login-email">
        E-mail
      </label>

      <input class="form__input" id="login-email" autocomplete="username" type="text" placeholder="Your e-mail">
    </div>

    <div class="form__item">
      <label class="form__label" for="login-password">
        Password
      </label>

      <input class="form__input" id="login-password" type="password" autocomplete="current-password" placeholder="Your password">
    </div>

    <button class="form__btn btn btn_light" type="submit">Send message</button>

    <p class="form__info">
      Don’t have account yet?
      <span>Sign up</span>
    </p>

    <p class="form__error"></p>
  </form>
</div>
